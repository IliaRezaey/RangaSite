<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل کارمندان رنگا</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazir';
        }
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #ffcfac 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .header {
            background: #ffffff;
            color: #000000;
            padding: 20px 30px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .header span {
            color: #e99918;
        }
        .section {
            padding: 30px;
            display: none;
        }
        .section.active {
            display: block;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #f39c12;
            border-radius: 8px;
            font-size: 16px;
            transition: border 0.3s;
        }
        .input-group input:focus {
            border-color: #f39c12;
            outline: none;
            box-shadow: 0 0 0 3px rgba(243,156,18,0.2);
        }
        .btn {
            background: #f39c12;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
            margin: 5px;
        }
        .btn:hover {
            background: #e67e22;
        }
        .btn-danger {
            background: #e74c3c;
        }
        .btn-danger:hover {
            background: #c0392b;
        }
        .btn-success {
            background: #2ecc71;
        }
        .btn-success:hover {
            background: #27ae60;
        }
        .btn-info {
            background: #3498db;
        }
        .btn-info:hover {
            background: #2980b9;
        }
        .card {
            background: #f8f9fa;
            border: 1px solid #eee;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            border-bottom: 2px solid #f39c12;
            padding-bottom: 8px;
        }
        .list-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #eee;
            transition: box-shadow 0.2s;
        }
        .list-item:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .task-checkbox {
            width: 20px;
            height: 20px;
            margin-left: 10px;
            accent-color: #f39c12;
        }
        .task-text {
            flex-grow: 1;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }
        .badge-success { background: #2ecc71; color: white; }
        .badge-warning { background: #f1c40f; color: #333; }
        .badge-danger { background: #e74c3c; color: white; }
        .percentage-circle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: conic-gradient(#2ecc71 calc(var(--percent) * 1%), #e0e0e0 0);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            margin: 10px auto;
        }
        .grid-2col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        @media (max-width: 600px) {
            .grid-2col {
                grid-template-columns: 1fr;
            }
        }
        select, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
            margin-top: 5px;
        }
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        .hidden {
            display: none;
        }
        .logout-btn {
            float: left;
            background: #95a5a6;
            margin: 10px;
        }
        .logout-btn:hover {
            background: #7f8c8d;
        }
        .employee-greeting {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .sep {
            margin: 20px 0;
            border-top: 1px dashed #ccc;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: center;
        }
        th {
            background: #f39c12;
            color: white;
        }
        .text-danger {
            color: #e74c3c;
            font-weight: bold;
        }
        .text-success {
            color: #27ae60;
            font-weight: bold;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">پنل کارمندان <span>رنگا</span><img src="images/ranga logo.png" alt="" style="width: 70px;"></div>

    <!-- Login Section -->
    <div id="login-section" class="section active">
        <div class="card">
            <div class="card-title">ورود به حساب کاربری</div>
            <div class="input-group">
                <label>نام کاربری</label>
                <input type="text" id="login-username" placeholder="نام کاربری خود را وارد کنید">
            </div>
            <div class="input-group">
                <label>رمز عبور</label>
                <input type="password" id="login-password" placeholder="رمز عبور خود را وارد کنید">
            </div>
            <div id="login-error" class="text-danger hidden" style="margin-bottom:10px;">نام کاربری یا رمز عبور اشتباه است!</div>
            <button class="btn" onclick="login()">ورود</button>
        </div>
    </div>

    <!-- Manager Panel -->
    <div id="manager-section" class="section">
        <button class="btn logout-btn" onclick="logout()">خروج</button>
        <h2>خوش آمدید، مدیر گرامی</h2>
                    <button class="btn btn-primary"><a href="factor.html" style="color: #ffffff;">فاکتور ساز اختصاصی</a></button>
                    <br>
<br>
<br>
<br>
        <!-- مدیریت کارمندان -->
        <div class="card">
            <div class="card-title">➕ مدیریت کارمندان</div>
            <div class="grid-2col">
                <div>
                    <div class="input-group">
                        <label>نام کامل</label>
                        <input type="text" id="emp-name" placeholder="نام و نام خانوادگی">
                    </div>
                    <div class="input-group">
                        <label>نام کاربری</label>
                        <input type="text" id="emp-username" placeholder="نام کاربری برای ورود">
                    </div>
                    <div class="input-group">
                        <label>رمز عبور</label>
                        <input type="password" id="emp-password" placeholder="رمز عبور">
                    </div>
                    <button class="btn btn-success" onclick="addEmployee()">افزودن کارمند</button>
                </div>
                <div>
                    <label>لیست کارمندان فعلی:</label>
                    <div id="employee-list" style="max-height:200px; overflow-y:auto;"></div>
                </div>
            </div>
        </div>

        <!-- تعریف وظایف برای کارمند -->
        <div class="card">
            <div class="card-title">📋 برنامه روزانه کارمندان</div>
            <div class="input-group">
                <label>انتخاب کارمند</label>
                <select id="task-employee-select" onchange="loadEmployeeTasksForManager()">
                    <option value="">-- انتخاب کنید --</option>
                </select>
            </div>
            <div id="assign-tasks-area" class="hidden">
                <label>وظایف روزانه (هر خط یک وظیفه):</label>
                <textarea id="tasks-textarea" placeholder="وظیفه 1&#10;وظیفه 2"></textarea>
                <button class="btn btn-info" onclick="saveTasks()">ذخیره وظایف</button>
            </div>
        </div>

        <!-- مشاهده عملکرد روزانه -->
        <div class="card">
            <div class="card-title">🔍 مشاهده عملکرد روزانه</div>
            <div class="grid-2col">
                <div class="input-group">
                    <label>کارمند</label>
                    <select id="perf-employee-select" onchange="loadDailyPerformance()">
                        <option value="">-- انتخاب کنید --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>تاریخ (به صورت YYYY-MM-DD)</label>
                    <input type="date" id="perf-date" onchange="loadDailyPerformance()">
                </div>
            </div>
            <div id="daily-performance-content" class="hidden">
                <h4 id="perf-date-title"></h4>
                <div id="perf-task-list"></div>
                <div style="margin-top:15px;">
                    <span id="daily-percentage"></span>
                    <button id="absence-btn" class="btn btn-danger" onclick="toggleAbsence()">ثبت غیبت</button>
                </div>
            </div>
        </div>

        <!-- گزارش ماهانه -->
        <div class="card">
            <div class="card-title">📊 گزارش ماهانه</div>
            <div class="grid-2col">
                <div class="input-group">
                    <label>کارمند</label>
                    <select id="monthly-emp-select" onchange="loadMonthlyReport()">
                        <option value="">-- انتخاب کنید --</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>سال-ماه (YYYY-MM)</label>
                    <input type="month" id="monthly-month" onchange="loadMonthlyReport()">
                </div>
            </div>
            <div id="monthly-report-content" class="hidden"></div>
        </div>
    </div>

    <!-- Employee Panel -->
    <div id="employee-section" class="section">
        <button class="btn logout-btn" onclick="logout()">خروج</button>
        <div class="employee-greeting" id="emp-greeting"></div>
        <div class="card">
            <div class="card-title">وظایف امروز</div>
            <div id="employee-tasks-list">در حال بارگذاری...</div>
            <div style="text-align:center; margin-top:20px;">
                <div class="percentage-circle" id="emp-percentage-circle" style="--percent:0;">0%</div>
                <p style="margin-top:5px;">درصد تکمیل وظایف امروز</p>
            </div>
            <div id="absence-message" class="hidden text-danger" style="text-align:center; margin-top:10px;">⚠️ امروز برای شما غیبت ثبت شده است.</div>
        </div>
    </div>
</div>

<script>
    // ================= DATA & STORAGE =================
    const STORAGE_KEY = 'rangaAppData';
    let appData;

    function loadData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) {
            appData = JSON.parse(stored);
        } else {
            // Initialize default data
            appData = {
                manager: {
                    username: "eliasranga",
                    password: "60056005"
                },
                employees: []
            };
            saveData();
        }
    }

    function saveData() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appData));
    }

    // Helper functions
    function getTodayDate() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
    }

    function getEmployeeByUsername(username) {
        return appData.employees.find(emp => emp.username === username);
    }

    // For a given employee and date, retrieve or create the daily log
    function getDailyLog(employee, date) {
        if (!employee.logs) employee.logs = {};
        if (!employee.logs[date]) {
            // Initialize with empty completedTasks map
            const tasks = employee.tasks || [];
            const completedTasks = {};
            tasks.forEach(task => { completedTasks[task] = false; });
            employee.logs[date] = {
                completedTasks: completedTasks,
                absent: false
            };
        }
        // Ensure that any new tasks added later are also in the log
        const log = employee.logs[date];
        const currentTasks = employee.tasks || [];
        currentTasks.forEach(task => {
            if (!(task in log.completedTasks)) {
                log.completedTasks[task] = false;
            }
        });
        // Remove tasks that are no longer assigned (cleanup)
        for (const task in log.completedTasks) {
            if (!currentTasks.includes(task)) {
                delete log.completedTasks[task];
            }
        }
        return log;
    }

    function calculatePercentage(employee, date) {
        const log = getDailyLog(employee, date);
        if (log.absent) return 0;
        const tasks = Object.keys(log.completedTasks);
        if (tasks.length === 0) return 0;
        const completed = Object.values(log.completedTasks).filter(v => v).length;
        return Math.round((completed / tasks.length) * 100);
    }

    // ================= UI SWITCHING =================
    function showSection(sectionId) {
        document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
        document.getElementById(sectionId).classList.add('active');
    }

    function login() {
        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const errorDiv = document.getElementById('login-error');

        if (!username || !password) {
            errorDiv.textContent = 'لطفاً نام کاربری و رمز عبور را وارد کنید.';
            errorDiv.classList.remove('hidden');
            return;
        }

        // Check manager
        if (username === appData.manager.username && password === appData.manager.password) {
            currentUser = { role: 'manager', data: appData.manager };
            showManagerPanel();
            return;
        }

        // Check employees
        const employee = getEmployeeByUsername(username);
        if (employee && employee.password === password) {
            currentUser = { role: 'employee', data: employee };
            showEmployeePanel();
            return;
        }

        errorDiv.textContent = 'نام کاربری یا رمز عبور اشتباه است!';
        errorDiv.classList.remove('hidden');
    }

    let currentUser = null;

    function logout() {
        currentUser = null;
        document.getElementById('login-username').value = '';
        document.getElementById('login-password').value = '';
        document.getElementById('login-error').classList.add('hidden');
        showSection('login-section');
    }

    // ================= MANAGER PANEL =================
    function showManagerPanel() {
        showSection('manager-section');
        refreshEmployeeDropdowns();
        refreshEmployeeList();
        document.getElementById('perf-date').value = getTodayDate();
        resetManagerViews();
    }

    function resetManagerViews() {
        document.getElementById('assign-tasks-area').classList.add('hidden');
        document.getElementById('daily-performance-content').classList.add('hidden');
        document.getElementById('monthly-report-content').classList.add('hidden');
    }

    // Refresh dropdowns (task assign, performance, monthly)
    function refreshEmployeeDropdowns() {
        const selects = ['task-employee-select', 'perf-employee-select', 'monthly-emp-select'];
        selects.forEach(id => {
            const select = document.getElementById(id);
            select.innerHTML = '<option value="">-- انتخاب کنید --</option>';
            appData.employees.forEach(emp => {
                const option = document.createElement('option');
                option.value = emp.username;
                option.textContent = `${emp.name} (${emp.username})`;
                select.appendChild(option);
            });
        });
    }

    function refreshEmployeeList() {
        const listDiv = document.getElementById('employee-list');
        if (appData.employees.length === 0) {
            listDiv.innerHTML = '<p>هیچ کارمندی ثبت نشده است.</p>';
            return;
        }
        listDiv.innerHTML = appData.employees.map(emp => `
            <div class="list-item">
                <span><strong>${emp.name}</strong> (${emp.username})</span>
                <div>
                    <button class="btn btn-danger" onclick="removeEmployee('${emp.username}')" style="padding:5px 10px; font-size:12px;">حذف</button>
                </div>
            </div>
        `).join('');
    }

    function addEmployee() {
        const name = document.getElementById('emp-name').value.trim();
        const username = document.getElementById('emp-username').value.trim();
        const password = document.getElementById('emp-password').value.trim();

        if (!name || !username || !password) {
            alert('لطفاً تمام فیلدها را پر کنید.');
            return;
        }

        if (username === appData.manager.username || getEmployeeByUsername(username)) {
            alert('این نام کاربری قبلاً استفاده شده است.');
            return;
        }

        const newEmp = {
            name: name,
            username: username,
            password: password,
            tasks: [],
            logs: {}
        };
        appData.employees.push(newEmp);
        saveData();
        document.getElementById('emp-name').value = '';
        document.getElementById('emp-username').value = '';
        document.getElementById('emp-password').value = '';
        refreshEmployeeList();
        refreshEmployeeDropdowns();
        alert('کارمند با موفقیت اضافه شد.');
    }

    function removeEmployee(username) {
        if (confirm(`آیا مطمئن هستید که می‌خواهید کارمند "${username}" را حذف کنید؟`)) {
            appData.employees = appData.employees.filter(emp => emp.username !== username);
            saveData();
            refreshEmployeeList();
            refreshEmployeeDropdowns();
            resetManagerViews();
        }
    }

    // Assign tasks
    function loadEmployeeTasksForManager() {
        const username = document.getElementById('task-employee-select').value;
        if (!username) {
            document.getElementById('assign-tasks-area').classList.add('hidden');
            return;
        }
        const emp = getEmployeeByUsername(username);
        document.getElementById('assign-tasks-area').classList.remove('hidden');
        document.getElementById('tasks-textarea').value = emp.tasks ? emp.tasks.join('\n') : '';
    }

    function saveTasks() {
        const username = document.getElementById('task-employee-select').value;
        if (!username) return;
        const emp = getEmployeeByUsername(username);
        const tasksText = document.getElementById('tasks-textarea').value.trim();
        const tasksArray = tasksText ? tasksText.split('\n').map(t => t.trim()).filter(t => t) : [];
        emp.tasks = tasksArray;
        saveData();
        alert('وظایف ذخیره شدند.');
        // If performance view is open for this employee, refresh
        if (document.getElementById('perf-employee-select').value === username) {
            loadDailyPerformance();
        }
    }

    // Daily performance
    function loadDailyPerformance() {
        const username = document.getElementById('perf-employee-select').value;
        const date = document.getElementById('perf-date').value;
        const contentDiv = document.getElementById('daily-performance-content');
        if (!username || !date) {
            contentDiv.classList.add('hidden');
            return;
        }
        const emp = getEmployeeByUsername(username);
        if (!emp) return;
        const log = getDailyLog(emp, date);
        const percentage = calculatePercentage(emp, date);

        document.getElementById('perf-date-title').textContent = `وضعیت ${emp.name} در تاریخ ${date}`;
        const taskListDiv = document.getElementById('perf-task-list');
        const tasks = emp.tasks || [];
        if (tasks.length === 0) {
            taskListDiv.innerHTML = '<p>هیچ وظیفه‌ای برای این کارمند تعریف نشده است.</p>';
        } else {
            taskListDiv.innerHTML = tasks.map(task => {
                const completed = log.completedTasks[task] || false;
                return `
                    <div class="list-item">
                        <span class="task-text">${task}</span>
                        <span class="${completed ? 'text-success' : 'text-danger'}">${completed ? '✔️ انجام شده' : '❌ انجام نشده'}</span>
                    </div>
                `;
            }).join('');
        }

        const percentageSpan = document.getElementById('daily-percentage');
        percentageSpan.innerHTML = `درصد تکمیل: <strong>${percentage}%</strong>`;

        const absenceBtn = document.getElementById('absence-btn');
        if (log.absent) {
            absenceBtn.textContent = 'لغو غیبت';
            absenceBtn.className = 'btn btn-info';
        } else {
            absenceBtn.textContent = 'ثبت غیبت';
            absenceBtn.className = 'btn btn-danger';
        }

        contentDiv.classList.remove('hidden');
    }

    function toggleAbsence() {
        const username = document.getElementById('perf-employee-select').value;
        const date = document.getElementById('perf-date').value;
        if (!username || !date) return;
        const emp = getEmployeeByUsername(username);
        const log = getDailyLog(emp, date);
        log.absent = !log.absent;
        saveData();
        loadDailyPerformance();
    }

    // Monthly report
    function loadMonthlyReport() {
        const username = document.getElementById('monthly-emp-select').value;
        const monthInput = document.getElementById('monthly-month').value; // format: YYYY-MM
        const contentDiv = document.getElementById('monthly-report-content');
        if (!username || !monthInput) {
            contentDiv.classList.add('hidden');
            return;
        }
        const emp = getEmployeeByUsername(username);
        if (!emp) return;
        const [year, month] = monthInput.split('-').map(Number);
        const daysInMonth = new Date(year, month, 0).getDate(); // month is 0-indexed in Date, but we use month as given

        let html = `<h4>گزارش ماهانه ${emp.name} - ${year}/${month}</h4>`;
        html += '<table><thead><tr><th>تاریخ</th><th>وضعیت</th><th>درصد تکمیل</th><th>جزئیات</th></tr></thead><tbody>';

        let totalPercent = 0;
        let countedDays = 0;
        for (let day = 1; day <= daysInMonth; day++) {
            const dateStr = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            const log = emp.logs ? emp.logs[dateStr] : null;
            let status = '-';
            let percent = 0;
            let detail = '-';
            if (log) {
                percent = calculatePercentage(emp, dateStr);
                if (log.absent) {
                    status = 'غیبت';
                    detail = 'غیبت ثبت شده';
                } else {
                    status = percent === 100 ? 'کامل' : (percent > 0 ? 'در حال انجام' : 'انجام نشده');
                    const completed = Object.values(log.completedTasks).filter(v => v).length;
                    const total = Object.keys(log.completedTasks).length;
                    detail = `${completed} از ${total} وظیفه`;
                }
            }
            html += `<tr>
                <td>${dateStr}</td>
                <td>${status}</td>
                <td>${percent}%</td>
                <td>${detail}</td>
            </tr>`;
            if (log && !log.absent) {
                totalPercent += percent;
                countedDays++;
            }
        }

        const avgPercent = countedDays > 0 ? Math.round(totalPercent / countedDays) : 0;
        html += `</tbody></table>`;
        html += `<p style="margin-top:10px;"><strong>میانگین درصد تکمیل در روزهای غیر غیبت:</strong> ${avgPercent}%</p>`;
        contentDiv.innerHTML = html;
        contentDiv.classList.remove('hidden');
    }

    // ================= EMPLOYEE PANEL =================
    function showEmployeePanel() {
        const emp = currentUser.data;
        document.getElementById('emp-greeting').textContent = `خوش آمدید، ${emp.name}`;
        renderEmployeeTasks();
        showSection('employee-section');
    }

    function renderEmployeeTasks() {
        const emp = currentUser.data;
        const today = getTodayDate();
        const log = getDailyLog(emp, today);
        const tasks = emp.tasks || [];
        const taskListDiv = document.getElementById('employee-tasks-list');
        const absenceMsg = document.getElementById('absence-message');
        const percentCircle = document.getElementById('emp-percentage-circle');

        if (log.absent) {
            absenceMsg.classList.remove('hidden');
            taskListDiv.innerHTML = `<p>امروز برای شما غیبت ثبت شده است. امکان ثبت وظایف وجود ندارد.</p>`;
            // Disable all checkboxes if any
        } else {
            absenceMsg.classList.add('hidden');
            if (tasks.length === 0) {
                taskListDiv.innerHTML = '<p>هیچ وظیفه‌ای برای امروز شما تعریف نشده است.</p>';
            } else {
                taskListDiv.innerHTML = tasks.map(task => {
                    const completed = log.completedTasks[task] || false;
                    const checkedAttr = completed ? 'checked' : '';
                    return `
                        <div class="list-item">
                            <label class="task-text">${task}</label>
                            <input type="checkbox" class="task-checkbox" data-task="${task.replace(/"/g, '&#34;')}" ${checkedAttr} onchange="toggleEmployeeTask(this)">
                        </div>
                    `;
                }).join('');
            }
        }

        const percentage = calculatePercentage(emp, today);
        percentCircle.style.setProperty('--percent', percentage);
        percentCircle.textContent = percentage + '%';
    }

    function toggleEmployeeTask(checkbox) {
        const emp = currentUser.data;
        const today = getTodayDate();
        const log = getDailyLog(emp, today);
        const task = checkbox.dataset.task;
        log.completedTasks[task] = checkbox.checked;
        saveData();
        // Update percentage circle
        const percentage = calculatePercentage(emp, today);
        const percentCircle = document.getElementById('emp-percentage-circle');
        percentCircle.style.setProperty('--percent', percentage);
        percentCircle.textContent = percentage + '%';
    }

    // ================= INITIALIZATION =================
    window.onload = function() {
        loadData();
        showSection('login-section');
        // Add default date for performance view
        const dateInput = document.getElementById('perf-date');
        if (dateInput) dateInput.value = getTodayDate();
        // Add event listener for Enter key on login
        document.getElementById('login-password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') login();
        });
    };
</script>
</body>
</html>
